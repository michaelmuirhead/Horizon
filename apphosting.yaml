# Firebase App Hosting backend config.
#
# One-time setup (run from the repo root, on your machine, not CI):
#   1. npm install -g firebase-tools
#   2. firebase login
#   3. firebase init apphosting
#      • Pick the Firebase project you want to deploy to.
#      • Connect your GitHub repository when prompted.
#      • Pick the live branch (usually `main`).
#   4. firebase apphosting:backends:create  (if init didn't make one)
#
# After that, every push to the live branch builds and deploys automatically
# via Cloud Build → Cloud Run. Production URL shows up in the Firebase
# Console → App Hosting page.
#
# This file is read by App Hosting at build/deploy time. Tweak as needed.

runConfig:
  # Single small instance is plenty for a personal-finance PWA. Bump cpu /
  # memoryMiB if SSR work grows.
  cpu: 1
  memoryMiB: 512
  # Scale to zero when idle so the free tier covers it.
  minInstances: 0
  maxInstances: 1
  # Each instance handles up to N concurrent requests before another spins up.
  concurrency: 80
  # Generous request timeout; SSR responses should be much faster than this.
  timeoutSeconds: 60

# The Cloud Sync feature reads NEXT_PUBLIC_FIREBASE_* values at build time.
# These specific values are public per Firebase docs (security is enforced by
# firestore.rules + the Authorized Domains allowlist), so they're safe to
# commit directly. Truly secret values would go in Secret Manager instead.
#
# Three values are prefilled from the horizon-fc7b8 project. Replace the three
# PASTE_*_HERE placeholders with the matching values from
# Firebase Console → Project settings → General → Your apps → Web app → Config.
# (Same six values as `.env.local`.)
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: PASTE_apiKey_HERE
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: horizon-fc7b8.firebaseapp.com
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: horizon-fc7b8
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: horizon-fc7b8.firebasestorage.app
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "PASTE_messagingSenderId_HERE"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: PASTE_appId_HERE
    availability: [BUILD]
